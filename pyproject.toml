[project]
name = "march7thassistant"
version = "0.1.0"
description = "March7thAssistant automation app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ruamel.yaml==0.19.1",
    "playsound3==3.3.1",
    "psutil==7.2.2",
    "requests[socks]==2.34.2",
    "charset_normalizer==3.4.7",
    "Pillow==12.3.0",
    "numpy==2.4.6",
    "opencv-python==4.13.0.92",
    "qrcode==8.2",
    "PySocks==1.7.1",
    "PyPAC==0.18.3",
    "py7zr==1.1.3",
    "matrix-nio==0.25.2",
    "python-socks[asyncio]==2.8.1",
    "openpyxl==3.1.5",
    "selenium==4.44.0",
    "websocket-client==1.9.0",
    "opencc==1.3.1",
    "rapidocr==3.8.1",
    "onnxruntime==1.26.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "polib==1.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
